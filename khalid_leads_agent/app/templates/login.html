<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رمز الدخول · Khalid Leads Agent</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem("kla-theme"); if (t) document.documentElement.dataset.theme = t;
    var p = localStorage.getItem("kla-palette"); if (p) document.documentElement.dataset.palette = p; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-card { width: min(380px, 100%); }
    .login-card h1 { font-size: 1.25rem; margin: 0 0 6px; }
    .login-card input { font-size: 1.6rem; letter-spacing: .4em; text-align: center; direction: ltr; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 12px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login" autocomplete="off">
    <h1>Khalid Leads Agent</h1>
    <p class="muted small">أدخل رمز الدخول (PIN) المكتوب في ملف <span class="ltr">.env</span> على جهازك.</p>
    {% if error == "wrong" %}<div class="alert error">الرمز غير صحيح.</div>{% endif %}
    {% if error.startswith("locked") %}<div class="alert error">محاولات كثيرة خاطئة. حاول بعد {{ error[6:] }} دقيقة.</div>{% endif %}
    <label class="field"><span>رمز الدخول</span>
      <input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" minlength="6" required autofocus></label>
    <button class="btn primary lg" type="submit">دخول</button>
  </form>
</div>
</body>
</html>
