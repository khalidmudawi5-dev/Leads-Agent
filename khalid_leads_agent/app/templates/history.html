{% extends "base.html" %}
{% block content %}
<div class="card">
  <form class="filters" id="filters">
    <label class="field"><span>الفترة</span><select name="period"><option value="today">اليوم</option><option value="week">هذا الأسبوع</option><option value="">الكل</option></select></label>
    <label class="field"><span>اسم العميل</span><input type="text" name="name"></label>
    <label class="field"><span>رقم الهاتف</span><input type="text" name="phone"></label>
    <label class="field"><span>النتيجة</span><select name="result" id="f-result"><option value="">الكل</option></select></label>
    <label class="field"><span>نجح تحديث Odoo؟</span><select name="odoo_ok"><option value="">الكل</option><option value="1">نعم</option><option value="0">لا</option></select></label>
    <label class="field"><span>نجح تحديث Sheet؟</span><select name="sheet_ok"><option value="">الكل</option><option value="1">نعم</option><option value="0">لا</option></select></label>
    <label class="field"><span>&nbsp;</span><button class="btn primary" type="submit">تطبيق</button></label>
  </form>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>وقت الاتصال</th><th>العميل</th><th>الهاتف</th><th>النتيجة</th><th>الملاحظات</th><th>Odoo</th><th>Google</th><th>Duration</th><th>Errors</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="10" class="empty"><span class="spinner"></span></td></tr></tbody>
  </table></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/history.js?v={{ version }}"></script>{% endblock %}
